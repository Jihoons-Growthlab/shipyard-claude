<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>조선소 통합관리 목업</title>
<style>
:root{
  --navy:#12294a;--navy2:#1b3a66;--blue:#2563eb;--bg:#f2f4f8;--card:#fff;--line:#d9dee8;--text:#1f2937;--muted:#6b7280;
  --ok:#16a34a;--warn:#d97706;--bad:#dc2626;--sky:#0ea5e9;--gray:#94a3b8;
  --fs:13px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;font-size:var(--fs);color:var(--text);background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h2{margin:0;font-size:16px}
h3{margin:0 0 8px;font-size:13.5px}
table{border-collapse:collapse;width:100%}
/* ---------- auth ---------- */
#auth{min-height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0d2040,#1f4a85);padding:24px}
.acard{width:100%;max-width:420px;background:#fff;border-radius:10px;padding:28px 30px;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.acard.wide{max-width:560px}
.acard h1{margin:0 0 4px;font-size:20px;color:var(--navy)}
.acard .sub{color:var(--muted);margin-bottom:18px}
.acard .logo{font-size:12px;letter-spacing:2px;color:var(--blue);font-weight:700;margin-bottom:6px}
.hint{background:#eff6ff;border:1px solid #bfdbfe;border-radius:6px;padding:9px 11px;font-size:12px;color:#1e40af;margin-top:14px;line-height:1.6}
.err{color:var(--bad);font-size:12px;min-height:18px;margin:6px 0}
.links{display:flex;justify-content:space-between;margin-top:12px;font-size:12px}
a.lnk{color:var(--blue);cursor:pointer;text-decoration:none}
a.lnk:hover{text-decoration:underline}
.otp{letter-spacing:8px;text-align:center;font-size:22px}
/* ---------- form ---------- */
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:3px}
.in,select.in,textarea.in{width:100%;height:30px;padding:4px 8px;border:1px solid var(--line);border-radius:5px;background:#fff}
textarea.in{height:auto;min-height:56px;resize:vertical}
.in:focus{outline:2px solid #bfdbfe;border-color:var(--blue)}
.in[readonly],.in:disabled{background:#f3f4f6;color:#6b7280}
.grid{display:grid;gap:10px 12px}
.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.span2{grid-column:span 2}.span3{grid-column:span 3}.span4{grid-column:span 4}
.btn{height:30px;padding:0 13px;border:1px solid var(--line);background:#fff;border-radius:5px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f3f6fb}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff}.btn.pri:hover{background:#1d4ed8}
.btn.dng{color:var(--bad);border-color:#fecaca}.btn.dng:hover{background:#fef2f2}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%;height:36px;margin-top:6px}
/* ---------- app shell ---------- */
#app{display:flex;flex-direction:column;height:100vh}
.top{height:50px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 16px;gap:14px;flex:none}
.top .brand{font-weight:700;font-size:15px;letter-spacing:.3px}
.top .brand small{font-weight:400;opacity:.65;margin-left:8px;font-size:11px}
.top .sp{flex:1}
.top select{height:26px;border-radius:4px;border:1px solid #3b5a8c;background:#1b3a66;color:#fff;padding:0 4px}
.wx{display:flex;align-items:center;gap:8px;background:#1b3a66;border-radius:18px;padding:4px 12px;font-size:12px;cursor:default}
.wx b{font-size:14px}
.wx .src{font-size:10px;background:#f59e0b;color:#3b2600;border-radius:3px;padding:0 4px}
.wx .src.live{background:#22c55e;color:#052e16}
.usr{display:flex;align-items:center;gap:8px}
.usr .nm{font-weight:700}
.usr .grp{font-size:11px;opacity:.7}
.top .btn{background:transparent;color:#fff;border-color:#3b5a8c;height:26px;padding:0 10px;font-size:12px}
.top .btn:hover{background:#1b3a66}
.body{flex:1;display:flex;min-height:0}
#menu{width:230px;flex:none;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:8px 0}
#menu .mh{font-size:11px;color:var(--muted);padding:6px 14px;letter-spacing:1px}
#menu ul{list-style:none;margin:0;padding:0}
#menu li>.mi{display:flex;align-items:center;gap:6px;padding:7px 14px;cursor:pointer;user-select:none}
#menu li>.mi:hover{background:#eef3fb}
#menu li>.mi.act{background:#dbeafe;color:#1d4ed8;font-weight:700}
#menu li>.mi .car{width:12px;color:var(--muted);font-size:10px;transition:transform .15s}
#menu li.open>.mi .car{transform:rotate(90deg)}
#menu li ul{display:none}
#menu li.open>ul{display:block}
#menu li ul .mi{padding-left:34px}
#menu li ul ul .mi{padding-left:54px}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#tabbar{display:flex;gap:2px;background:#e4e8f0;padding:6px 8px 0;overflow-x:auto;flex:none;min-height:36px}
.tab{display:flex;align-items:center;gap:8px;padding:0 6px 0 12px;height:30px;background:#cfd6e4;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap;font-size:12.5px;color:#374151}
.tab.act{background:#fff;font-weight:700;color:var(--navy)}
.tab .x{width:18px;height:18px;line-height:17px;text-align:center;border-radius:50%;color:#6b7280}
.tab .x:hover{background:#dc2626;color:#fff}
.tabtools{margin-left:auto;display:flex;align-items:flex-start;padding-left:8px}
#panes{flex:1;min-height:0;position:relative;background:#fff;border-top:1px solid var(--line)}
.pane{position:absolute;inset:0;overflow:auto;padding:14px 18px 24px;background:var(--bg)}
.ph{display:flex;align-items:baseline;gap:10px;margin-bottom:12px}
.ph .d{color:var(--muted);font-size:12px}
.ph .ro{background:#fef3c7;color:#92400e;border-radius:3px;font-size:11px;padding:1px 6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:12px}
.card>h3{display:flex;align-items:center;justify-content:space-between}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bar .in{width:auto;min-width:110px}
.bar .sp{flex:1}
.empty{color:var(--muted);padding:18px;text-align:center}
/* ---------- table ---------- */
.tw{border:1px solid var(--line);border-radius:6px;overflow:auto;background:#fff}
.tbl th{position:sticky;top:0;background:#eef1f6;text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);font-weight:600;white-space:nowrap;z-index:1}
.tbl td{padding:6px 9px;border-bottom:1px solid #edf0f5;white-space:nowrap}
.tbl tr[data-act]{cursor:pointer}
.tbl tbody tr:hover{background:#f4f8ff}
.tbl tr.sel{background:#dbeafe!important}
.tbl td.wrap{white-space:normal}
.num{text-align:right}
/* ---------- badge ---------- */
.bdg{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;background:#e5e7eb;color:#374151}
.s-plan{background:#e2e8f0;color:#475569}.s-ready{background:#e0f2fe;color:#0369a1}.s-work{background:#dbeafe;color:#1d4ed8}.s-done{background:#dcfce7;color:#15803d}.s-delay{background:#fee2e2;color:#b91c1c}
.d-draft{background:#e2e8f0;color:#475569}.d-review{background:#fef3c7;color:#92400e}.d-approved{background:#e0f2fe;color:#0369a1}.d-issued{background:#dcfce7;color:#15803d}.d-obsolete{background:#f3f4f6;color:#9ca3af;text-decoration:line-through}
.b-warn{background:#fef3c7;color:#92400e}.b-bad{background:#fee2e2;color:#b91c1c}.b-ok{background:#dcfce7;color:#15803d}.b-info{background:#dbeafe;color:#1d4ed8}
.pbar{position:relative;height:16px;min-width:90px;background:#e5e7eb;border-radius:8px;overflow:hidden}
.pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--blue)}
.pbar b{position:relative;font-size:10.5px;line-height:16px;display:block;text-align:center;color:#111}
/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer}
.kpi:hover{border-color:var(--blue)}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .v{font-size:26px;font-weight:700;margin-top:2px}
.kpi.bad .v{color:var(--bad)}.kpi.warn .v{color:var(--warn)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cols3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.hb{display:grid;grid-template-columns:130px 1fr 44px;align-items:center;gap:8px;margin:7px 0}
.hb .t{height:14px;background:#e5e7eb;border-radius:7px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--blue)}
.hb .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.donut{display:flex;align-items:center;gap:18px}
.lg{font-size:12px;line-height:1.9}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.stk{display:flex;height:16px;border-radius:4px;overflow:hidden;background:#e5e7eb}
.stk div{height:100%}
.cols{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.cols .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px}
.cols .c i{display:block;width:70%;background:var(--navy2);border-radius:3px 3px 0 0;min-height:2px}
.lst{list-style:none;margin:0;padding:0}
.lst li{padding:7px 4px;border-bottom:1px solid #edf0f5;display:flex;justify-content:space-between;gap:8px;cursor:pointer}
.lst li:hover{background:#f4f8ff}
.lst li:last-child{border:0}
.lst .m{color:var(--muted);font-size:12px}
/* ---------- split / subtab ---------- */
.split{display:flex;flex-direction:column;height:calc(100% - 4px);gap:10px}
.split .top-p{flex:1 1 50%;min-height:160px;display:flex;flex-direction:column}
.split .bot-p{flex:1 1 50%;min-height:220px;overflow:auto}
.split .top-p .tw{flex:1}
.stabs{display:flex;gap:2px;border-bottom:2px solid var(--line);margin-bottom:12px}
.stabs a{padding:7px 14px;cursor:pointer;border-radius:5px 5px 0 0;color:var(--muted)}
.stabs a.act{background:#fff;color:var(--blue);font-weight:700;border:1px solid var(--line);border-bottom:2px solid #fff;margin-bottom:-2px}
.note{font-size:12px;color:var(--muted);margin-top:6px}
.warnbox{background:#fffbeb;border:1px solid #fde68a;color:#92400e;border-radius:6px;padding:8px 11px;margin-bottom:10px;font-size:12.5px}
.okbox{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;border-radius:6px;padding:8px 11px;margin-bottom:10px;font-size:12.5px}
/* ---------- gantt ---------- */
.gm{position:absolute;top:0;height:34px;border-left:1px solid #cbd5e1;font-size:11px;padding:2px 5px;color:#475569;white-space:nowrap}
.gvl{position:absolute;top:0;bottom:0;border-left:1px dashed #e2e8f0}
.gbar{position:absolute;height:16px;margin-top:6px;border-radius:3px;cursor:pointer;overflow:hidden;border:1px solid rgba(0,0,0,.15)}
.gbar i{display:block;height:100%;opacity:.95}
.gtoday{position:absolute;top:0;bottom:0;border-left:2px solid #ef4444;z-index:1}
.gtoday span{white-space:nowrap;position:absolute;top:34px;left:2px;font-size:10px;color:#ef4444;background:#fff}
.gsvg{position:absolute;left:0;top:0;pointer-events:none}
.c-plan{background:#cbd5e1}.c-plan i{background:#94a3b8}
.c-ready{background:#bae6fd}.c-ready i{background:#0ea5e9}
.c-work{background:#bfdbfe}.c-work i{background:#2563eb}
.c-done{background:#bbf7d0}.c-done i{background:#16a34a}
.c-delay{background:#fecaca}.c-delay i{background:#dc2626}
.glegend{display:flex;gap:14px;font-size:12px;margin:8px 0}
.glegend i{display:inline-block;width:12px;height:10px;margin-right:4px;border-radius:2px}
#modal{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:2vh 1.5vw}
.mdlg{background:var(--bg);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.4);width:min(1100px,96vw);max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.mdlg.xl{width:min(1640px,97vw);height:94vh}
.mhead{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--navy);color:#fff;flex:none}
.mhead b{font-size:14px}.mhead .sp{flex:1}
.mhead .btn{background:transparent;color:#fff;border-color:#3b5a8c}.mhead .btn:hover{background:#1b3a66}
#mbody.pane{position:relative;inset:auto;flex:1;min-height:0;overflow:auto;padding:14px 18px 20px}
.mdlg.xl #mbody.pane{overflow:hidden}
#mbody .ph h2{display:none}
.dwgx{position:absolute;inset:12px 16px;display:grid;grid-template-columns:minmax(0,1fr) 440px;gap:12px}
.dwgx>div{min-height:0}
.dwgx .vcard{display:flex;flex-direction:column;margin:0;height:100%}
.dwgx .vcard .pdfbox{flex:1;min-height:0;height:auto}
.dwgx .side{overflow:auto;padding-right:2px}
.dwgx .side .tw.r3 .tbl td,.dwgx .side .tw.r3 .tbl th{padding-left:7px;padding-right:7px}
.dwgx .side .tw.r3 .tbl td{max-width:130px}
@media(max-width:1000px){.mdlg.xl #mbody.pane{overflow:auto}.dwgx{position:static;display:block}.dwgx .vcard{height:auto}.dwgx .vcard .pdfbox{height:70vh;flex:none}}
/* 간트: 가로·세로 스크롤은 .g3 하나. 왼쪽 라벨 열은 가로 스크롤에서 고정(sticky left), 헤더 행은 세로 스크롤에서 고정(sticky top) */
.g3{border:1px solid var(--line);border-radius:6px;background:#fff;overflow:auto;min-height:140px}
.g3in{position:relative}
.g2row{display:flex;height:28px;border-bottom:1px solid #edf0f5;cursor:pointer;background:#fff}
.g2row.sel{background:#dbeafe}
.g2l{width:230px;flex:none;position:sticky;left:0;z-index:3;padding:0 9px;line-height:27px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px;border-right:1px solid var(--line);background:inherit}
.g2l .bc{display:inline-block;min-width:30px;color:var(--muted)}
.g2t{flex:1;min-width:0;position:relative}
.g2head{position:sticky;top:0;z-index:5;height:34px;background:#eef1f6;border-bottom:1px solid var(--line);cursor:default}
.g2head .g2l{z-index:6;font-weight:600;line-height:33px;background:#eef1f6}
.g2ov{position:absolute;left:230px;right:0;top:34px;bottom:0;pointer-events:none;overflow:hidden;z-index:1}
.g2ov .gtoday span{top:2px}
/* 공정 계획 화면: 간트(남는 높이 사용) + 하단 상세 패널을 한 화면에 */
.pane.fx>*{flex:none}
.pane.fx>.g3{flex:1 1 0;min-height:140px;margin-bottom:10px}
.pp{margin:0;padding:10px 14px}
.pp-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:13.5px}
.pp-h .m{color:var(--muted);font-size:12px}
.pp-body{display:grid;grid-template-columns:minmax(0,1fr) 430px;gap:16px}
.pp-r h4{margin:0 0 6px;font-size:12.5px}
.pp-r .warnbox{margin:0 0 6px;padding:5px 9px;font-size:12px}
.ppnote{font-size:12px;color:var(--muted);padding:6px 2px}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:99}
#toast div{background:#111827;color:#fff;padding:10px 16px;border-radius:6px;box-shadow:0 4px 16px rgba(0,0,0,.25);max-width:420px}
#toast div.e{background:#b91c1c}
#toast div.s{background:#15803d}
</style>
</head>
<body>
<div id="auth"></div>
<div id="app" hidden>
  <header class="top">
    <div class="brand">⚓ SWP 조선소 통합관리<small>MOCKUP · 호선 / 공정 / 도면</small></div>
    <div class="sp"></div>
    <div class="wx" id="wx"></div>
    <div class="usr" id="usr"></div>
    <button class="btn" id="btnReset" title="시드 데이터로 초기화">데이터 초기화</button>
    <button class="btn" id="btnLogout">로그아웃</button>
  </header>
  <div class="body">
    <aside id="menu"></aside>
    <main>
      <div id="tabbar"></div>
      <div id="panes"></div>
    </main>
  </div>
</div>
<div id="modal" hidden><div class="mdlg" id="mdlg"><div class="mhead"><b id="mtitle"></b><span class="sp"></span><button class="btn sm" data-act="modalClose" title="닫기 (Esc)">닫기 ✕</button></div><div class="pane" id="mbody"></div></div></div>
<div id="toast"></div>
<script>
'use strict';
/* =====================================================================
 * 조선소 SI 목업 — 단일 HTML. 데이터는 DB.<테이블명> 으로 shipyard_schema.sql 과 1:1 대응.
 * 저장: localStorage (데이터 초기화 버튼으로 시드 복원). 기준일은 TODAY 고정(데모 재현성).
 * ===================================================================== */
const TODAY = '2026-10-19';
const KEY = 'swp_mock_db_v1', SKEY = 'swp_mock_sess_v1';
const D = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / 864e5; };
const S = n => new Date(n * 864e5).toISOString().slice(0, 10);
const add = (s, n) => S(D(s) + n);
const diff = (a, b) => D(b) - D(a);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hp = s => { let h = 5381; for (const c of String(s)) h = ((h << 5) + h + c.charCodeAt(0)) >>> 0; return 'h' + h.toString(16); };
const nowStr = () => TODAY + ' ' + new Date().toTimeString().slice(0, 5);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- 공통코드 (TB_SYS_CodeGroup / TB_SYS_Code) ---------- */
const CG = {
  SHIPTYPE: ['선종', 'LNG=LNG운반선,VLCC=원유운반선,CONT=컨테이너선,PC=PC선'],
  HULLSTAT: ['호선상태', 'PLAN=계획,DESIGN=설계,BUILD=건조,LAUNCH=진수,TRIAL=시운전,DELIVER=인도'],
  MILESTONE: ['주요일정', 'CUT=강재절단,KEEL=기공(Keel Laying),LAUNCH=진수,TRIAL=시운전,DELIVER=인도'],
  BLOCKTYPE: ['블록유형', 'FLAT=평블록,CURVE=곡블록,ENGINE=엔진룸'],
  PLANSTAT: ['공정상태', 'PLAN=계획,READY=착수가능,WORK=진행,DONE=완료,DELAY=지연'],
  DWGDISC: ['도면분야', 'HULL=선체,MACH=기계,ELEC=전장,PIPE=배관,OUTFIT=의장'],
  DWGSTAT: ['도면상태', 'DRAFT=작성중,REVIEW=검토중,APPROVED=승인,ISSUED=배포,OBSOLETE=폐기'],
};
let DB = null, SESSION = null;

/* ---------- 시드 ---------- */
function seed() {
  const db = {};
  db.TB_SYS_CodeGroup = Object.entries(CG).map(([k, v], i) => ({ CodeGroup: k, CodeGroupName: v[0], Seq: i + 1, UseYN: true }));
  db.TB_SYS_Code = Object.entries(CG).flatMap(([g, v]) => v[1].split(',').map((x, i) => { const [c, n] = x.split('='); return { CodeGroup: g, Code: c, CodeName: n, Seq: i + 1, UseYN: true }; }));

  /* 회원/권한 */
  const U = (id, ln, fn, bd, ph, pw, st, otp, em) => ({
    id: 'u-' + id, email: em || id + '@swp.co.kr', password_hash: hp(pw), display_name: ln + fn, emp_no: id, status: st,

const wAvg = ps => { const t = ps.reduce((s, p) => s + diff(p.PlanStartDt, p.PlanEndDt) + 1, 0); return t ? Math.round(ps.reduce((s, p) => s + p.ProgressRate * (diff(p.PlanStartDt, p.PlanEndDt) + 1), 0) / t) : 0; };
const hullProgress = no => wAvg(DB.TB_PRC_Plan.filter(p => p.HullNo === no));

/* 도면 게이트: 필수 연계 도면 중 배포된 Rev 가 없는 것 */
function gate(p) {
  const bl = DB.TB_DWG_PlanLink.filter(l => l.PlanId === p.PlanId && l.RequiredYN).map(l => drw(l.DrawingId)).filter(d => d && d.DwgStatus !== 'OBSOLETE' && !hasIssued(d.DrawingId));
  return { ok: !bl.length, blockers: bl };
}
/* 개정 영향: 최근 30일 내 Rev≥1 배포 도면 → 연계 공정 중 착수/완료된 것 */
function impacts() {
  const out = [];
  DB.TB_DWG_Drawing.forEach(d => {
    const r = revs(d.DrawingId).filter(x => x.RevStatus === 'ISSUED' && x.RevNo >= 1 && x.IssueDt && diff(x.IssueDt, TODAY) <= 30 && diff(x.IssueDt, TODAY) >= 0).pop();
    if (!r) return;
    DB.TB_DWG_PlanLink.filter(l => l.DrawingId === d.DrawingId).map(l => planOf(l.PlanId)).filter(p => p && ['WORK', 'DONE', 'DELAY'].includes(p.PlanStatus)).forEach(p => out.push({ d, r, p }));
  });
  return out;
}
/* 공정 상태 재계산 (규칙: 도면 게이트·선행공정·지연) + 호선 상태 자동 전이 */
function refreshStatuses() {
  DB.TB_PRC_Plan.forEach(p => {
    if (p.ProgressRate >= 100) { p.PlanStatus = 'DONE'; return; }
    if (p.ProgressRate > 0 || p.ActualStartDt) { p.PlanStatus = p.PlanEndDt < TODAY ? 'DELAY' : 'WORK'; return; }
    if (p.PlanEndDt < TODAY) { p.PlanStatus = 'DELAY'; return; }
    p.PlanStatus = predsOf(p.PlanId).every(x => x.PlanStatus === 'DONE') && gate(p).ok ? 'READY' : 'PLAN';
  });
  /* 선행 완료 여부는 순서에 따라 달라질 수 있어 한 번 더 */
  DB.TB_PRC_Plan.forEach(p => { if (p.PlanStatus === 'PLAN' || p.PlanStatus === 'READY') p.PlanStatus = predsOf(p.PlanId).every(x => x.PlanStatus === 'DONE') && gate(p).ok ? 'READY' : 'PLAN'; });
  DB.TB_MST_Hull.forEach(h => {
    const ps = DB.TB_PRC_Plan.filter(p => p.HullNo === h.HullNo); if (!ps.length) return;
    const l = ps.find(p => p.ProcCd === 'LAUNCH');
    if (h.HullStatus === 'DESIGN' && ps.some(p => p.PlanStatus === 'WORK')) h.HullStatus = 'BUILD';
    if (h.HullStatus === 'BUILD' && l && l.PlanStatus === 'DONE') h.HullStatus = 'LAUNCH';
  });
}

function donut(items) {
  const tot = items.reduce((s, i) => s + i.v, 0) || 1, C = 2 * Math.PI * 40; let off = 0;
  const segs = items.filter(i => i.v).map(i => { const len = i.v / tot * C; const s = `<circle r="40" cx="60" cy="60" fill="none" stroke="${i.c}" stroke-width="22" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`; off += len; return s; }).join('');
  return `<div class="donut"><svg width="120" height="120" viewBox="0 0 120 120">${segs}<text x="60" y="58" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">${items.reduce((s, i) => s + i.v, 0)}</text><text x="60" y="74" text-anchor="middle" font-size="10" fill="#6b7280">전체</text></svg>
  <div class="lg">${items.map(i => `<div><i style="background:${i.c}"></i>${esc(i.l)} <b>${i.v}</b></div>`).join('')}</div></div>`;
}

  const objs = ['<< /Type /Catalog /Pages 2 0 R >>', '<< /Type /Pages /Kids [3 0 R] /Count 1 >>', '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595 420] /Contents 5 0 R /Resources << /Font << /F1 4 0 R >> >> >>', '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>', `<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`];

};
ACT.dwgPdfOpen = (el, tab) => { const s = ST(tab.key); if (s.url) window.open(s.url, '_blank'); else toast('표시 중인 PDF가 없습니다.', 'e'); };
ACT.dwgHullChg = (el, tab) => { const f = el.form, bs = f.elements.BlockId; bs.innerHTML = opt(DB.TB_MST_Block.filter(b => b.HullNo === el.value).map(b => [b.BlockId, `${b.BlockCd} ${b.BlockNm}`]), '', '블록 없음'); };
ACT.dwgSave = async (el, tab) => {
  const f = $('#df', paneEl(tab.key)), o = fd(f), isNew = tab.param === 'new';
  if (!o.DrawingNo || !o.DrawingNm) return toast('도면번호와 도면명을 입력하세요.', 'e');
  const pf = isNew && f.elements.pdf && f.elements.pdf.files[0];
  if (pf) { const er = pdfError(pf); if (er) return toast(er, 'e'); }
  if (isNew) {
    if (DB.TB_DWG_Drawing.some(d => d.DrawingNo === o.DrawingNo)) return toast('이미 존재하는 도면번호입니다.', 'e');
    const id = nid('TB_DWG_Drawing', 'DrawingId');
    DB.TB_DWG_Drawing.push({ DrawingId: id, DrawingNo: o.DrawingNo, DrawingNm: o.DrawingNm, HullNo: f.elements.HullNo.value, BlockId: o.BlockId ? Number(o.BlockId) : null, Discipline: o.Discipline, DwgStatus: 'DRAFT', CurrentRevNo: 0, DesignerEmpNo: o.DesignerEmpNo || null, UseYN: true, CreateUserId: SESSION.emp, CreateDt: TODAY });
    const rev0 = { DrawingId: id, RevNo: 0, RevStatus: 'DRAFT', ChangeDesc: '최초 작성', FileId: null, FileNm: null, AuthorEmpNo: SESSION.emp, IssueDt: null, CreateDt: TODAY };
    DB.TB_DWG_Revision.push(rev0);
    let fileMsg = '';
    if (pf) { try { await attachPdf(rev0, pf); fileMsg = ' PDF 첨부됨.'; } catch (e) { fileMsg = ' (PDF 저장 실패: 등록 후 다시 업로드하세요)'; } }
    save(); closeTab(tab.key); rerenderAll(); openTab('dwg-detail', id); toast('도면이 등록되었습니다. (Rev0 작성중)' + fileMsg, 's');
  } else { Object.assign(drw(tab.param), { DrawingNm: o.DrawingNm, BlockId: o.BlockId ? Number(o.BlockId) : null, Discipline: o.Discipline, DesignerEmpNo: o.DesignerEmpNo || null, ModifyUserId: SESSION.emp, ModifyDt: TODAY }); done(); toast('저장되었습니다.', 's'); }
};
ACT.dwgDel = (el, tab) => { if (!confirm('도면과 리비전·결재·공정 연계를 삭제합니다.')) return; const id = tab.param; dropFiles([id]); closeTab(tab.key); deleteDrawing(id); done(); toast('삭제되었습니다.', 's'); };
ACT.revNew = async (el, tab) => {
  const f = $('#nrf', paneEl(tab.key)), o = fd(f), d = drw(tab.param), lr = latestRev(d.DrawingId);
  if (!o.ChangeDesc) return toast('개정 사유를 입력하세요.', 'e');
  const pf = f.elements.pdf && f.elements.pdf.files[0];
  if (pf) { const er = pdfError(pf); if (er) return toast(er, 'e'); }
  const rev = { DrawingId: d.DrawingId, RevNo: lr.RevNo + 1, RevStatus: 'DRAFT', ChangeDesc: o.ChangeDesc, FileId: null, FileNm: null, AuthorEmpNo: SESSION.emp, IssueDt: null, CreateDt: TODAY };
  DB.TB_DWG_Revision.push(rev); d.DwgStatus = 'DRAFT';
  let fileMsg = '';
  if (pf) { try { await attachPdf(rev, pf); fileMsg = ' PDF 첨부됨.'; } catch (e) { fileMsg = ' (PDF 저장 실패: 뷰어에서 다시 업로드하세요)'; } }
  ST(tab.key).vrev = rev.RevNo; done(); toast(`Rev${rev.RevNo} 작성중으로 생성되었습니다.` + fileMsg, 's');
};
ACT.revRequest = (el, tab) => {
  const o = fd($('#arf', paneEl(tab.key))), d = drw(tab.param), lr = latestRev(d.DrawingId);
  if (o.a1 === o.a2) return toast('검토자와 승인자는 서로 다른 사람이어야 합니다.', 'e');
  DB.TB_DWG_Approval = DB.TB_DWG_Approval.filter(a => !(a.DrawingId === d.DrawingId && a.RevNo === lr.RevNo));
  [o.a1, o.a2].forEach((e, i) => DB.TB_DWG_Approval.push({ ApprovalId: nid('TB_DWG_Approval', 'ApprovalId'), DrawingId: d.DrawingId, RevNo: lr.RevNo, StepNo: i + 1, ApproverEmpNo: e, Result: 'WAIT', Comment: null, ActDt: null }));
  lr.RevStatus = 'REVIEW'; d.DwgStatus = 'REVIEW'; done(); toast('결재가 요청되었습니다.', 's');
};
ACT.revIssue = el => { issueRev(Number(el.dataset.id), Number(el.dataset.rev)); done(); toast('도면이 배포되었습니다. 연계 공정 상태가 갱신됩니다.', 's'); };
ACT.dwgLinkAdd = (el, tab) => {
  const o = fd($('#lf', paneEl(tab.key))); if (!o.p) return toast('공정을 선택하세요.', 'e');
  const p = planOf(Number(o.p)); DB.TB_DWG_PlanLink.push({ DrawingId: Number(tab.param), PlanId: p.PlanId, RequiredYN: o.req, NeedDt: p.PlanStartDt }); done(); toast('공정이 연계되었습니다.', 's');
};

/* ---------- 도면 결재함 ---------- */
SCREENS['dwg-approval'] = {
  title: () => '결재함',
  render() {
    const me = SESSION.emp, A = DB.TB_DWG_Approval;
    const mine = A.filter(a => a.Result === 'WAIT' && a.ApproverEmpNo === me && A.filter(x => x.DrawingId === a.DrawingId && x.RevNo === a.RevNo && x.StepNo < a.StepNo).every(x => x.Result === 'APPROVE') && (revs(a.DrawingId).find(r => r.RevNo === a.RevNo) || {}).RevStatus === 'REVIEW');
    const ready = DB.TB_DWG_Drawing.filter(d => latestRev(d.DrawingId).RevStatus === 'APPROVED');
    const hist = A.filter(a => a.Result !== 'WAIT').sort((a, b) => (b.ActDt || '').localeCompare(a.ActDt || '')).slice(0, 10);
    const eff = d => DB.TB_DWG_PlanLink.filter(l => l.DrawingId === d.DrawingId).map(l => planOf(l.PlanId)).filter(p => p && p.PlanStatus === 'PLAN');
    return ph('도면 결재함', `${esc(uname(me))} 님의 결재 대기와 배포 대기 도면입니다.`) + `
    <div class="card"><h3>내 결재 대기 <span class="bdg b-warn">${mine.length}</span></h3>${tbl(['도면번호', '도면명', 'Rev', '단계', '변경사유', '의견', ''], mine.map(a => { const d = drw(a.DrawingId), r = revs(a.DrawingId).find(x => x.RevNo === a.RevNo); return `<tr><td><a class="lnk" data-act="openDwg" data-id="${d.DrawingId}">${esc(d.DrawingNo)}</a></td><td>${esc(d.DrawingNm)}</td><td>Rev${a.RevNo}</td><td>${a.StepNo === 1 ? '검토' : '승인'}</td><td class="wrap">${esc(r.ChangeDesc || '')}</td><td><input class="in" style="width:200px" placeholder="의견 (반려 시 필수)"></td><td><button class="btn sm ok" data-act="apvDo" data-id="${a.ApprovalId}" data-res="APPROVE" data-w>승인</button> <button class="btn sm dng" data-act="apvDo" data-id="${a.ApprovalId}" data-res="REJECT" data-w>반려</button></td></tr>`; }).join(''))}</div>
    <div class="card"><h3>배포 대기 (승인 완료) <span class="bdg b-info">${ready.length}</span></h3>${tbl(['도면번호', '도면명', 'Rev', '배포 시 착수 가능해질 수 있는 공정', ''], ready.map(d => `<tr><td><a class="lnk" data-act="openDwg" data-id="${d.DrawingId}">${esc(d.DrawingNo)}</a></td><td>${esc(d.DrawingNm)}</td><td>Rev${latestRev(d.DrawingId).RevNo}</td><td>${esc(eff(d).map(planLabel).join(', ') || '-')}</td><td><button class="btn sm ok" data-act="revIssue" data-id="${d.DrawingId}" data-rev="${latestRev(d.DrawingId).RevNo}" data-w>배포</button></td></tr>`).join(''))}</div>
    <div class="card"><h3>최근 결재 이력</h3>${tbl(['일시', '도면번호', 'Rev', '단계', '결재자', '결과', '의견'], hist.map(a => `<tr><td>${a.ActDt || ''}</td><td>${esc((drw(a.DrawingId) || {}).DrawingNo || '')}</td><td>Rev${a.RevNo}</td><td>${a.StepNo === 1 ? '검토' : '승인'}</td><td>${esc(uname(a.ApproverEmpNo))}</td><td>${badge(a.Result === 'APPROVE' ? '승인' : '반려', a.Result === 'APPROVE' ? 'b-ok' : 'b-bad')}</td><td>${esc(a.Comment || '')}</td></tr>`).join(''))}</div>`;
  },
};
ACT.apvDo = el => {
  const a = DB.TB_DWG_Approval.find(x => x.ApprovalId === Number(el.dataset.id)), cm = $('input', el.closest('tr')).value.trim(), res = el.dataset.res;
  if (res === 'REJECT' && !cm) return toast('반려 시 의견을 입력하세요.', 'e');
  a.Result = res; a.Comment = cm || (res === 'APPROVE' ? '승인' : ''); a.ActDt = nowStr();
  const d = drw(a.DrawingId), r = revs(a.DrawingId).find(x => x.RevNo === a.RevNo);
  if (res === 'REJECT') { r.RevStatus = 'DRAFT'; d.DwgStatus = 'DRAFT'; DB.TB_DWG_Approval = DB.TB_DWG_Approval.filter(x => !(x.DrawingId === a.DrawingId && x.RevNo === a.RevNo && x.Result === 'WAIT')); }
  else if (DB.TB_DWG_Approval.filter(x => x.DrawingId === a.DrawingId && x.RevNo === a.RevNo).every(x => x.Result === 'APPROVE')) { r.RevStatus = 'APPROVED'; d.DwgStatus = 'APPROVED'; }
  done(); toast(res === 'APPROVE' ? '승인했습니다.' : '반려했습니다. 도면은 작성중으로 되돌려집니다.', 's');
};

/* ---------- 회원관리 (상하 2분할 CRUD) ---------- */
const USTAT = { pending: ['승인대기', 'b-warn'], approved: ['승인', 'b-ok'], rejected: ['반려', 'b-bad'], disabled: ['중지', ''] };
SCREENS['user-mgmt'] = {
  title: () => '회원관리',
  render(t) {
    const s = ST(t.key), f = s.f || {};
    const L = DB.users.filter(u => (!f.status || u.status === f.status) && (!f.q || (u.emp_no + u.display_name + u.email + u.phone).toLowerCase().includes(f.q.toLowerCase())));
    const isNew = s.sel === 'new', u = isNew ? { status: 'approved', totp_enabled: false } : DB.users.find(x => x.emp_no === s.sel);
    const gnm = e => groupsOf(e).map(g => (DB.TB_SYS_AuthGroup.find(x => x.AuthCd === g) || {}).AuthNm).join(', ') || '-';
    const rows = L.map(x => `<tr data-act="usrPick" data-id="${esc(x.emp_no)}" class="${s.sel === x.emp_no ? 'sel' : ''}"><td><b>${esc(x.emp_no)}</b></td><td>${esc(x.display_name)}</td><td>${esc(x.email)}</td><td>${esc(x.phone)}</td><td>${x.birth_date || ''}</td><td>${badge(USTAT[x.status][0], USTAT[x.status][1])}</td><td>${x.totp_enabled ? '사용' : '-'}</td><td>${esc(gnm(x.emp_no))}</td><td>${x.created_at}</td></tr>`).join('');
    const form = u ? `<form id="uf" class="grid g4" autocomplete="off" onsubmit="return false">
      ${fld('성 *', inp('ln', u.last_name || ''))}${fld('이름 *', inp('fn', u.first_name || ''))}${fld('생년월일 *', inp('bd', u.birth_date || '', 'type="date"'))}${fld('전화번호 *', inp('ph', u.phone || '', 'placeholder="010-0000-0000"'))}
      ${fld('이메일 *', inp('em', u.email || '', 'type="email"'), 'span2')}${fld('아이디 *', inp('id', u.emp_no || '', isNew ? '' : 'readonly'))}${fld(isNew ? '비밀번호 *' : '비밀번호 (변경 시만 입력)', inp('pw', '', 'type="password" autocomplete="new-password" placeholder="8자 이상"'))}
      ${fld('상태', `<select class="in" name="status">${opt(Object.entries(USTAT).map(([k, v]) => [k, v[0]]), u.status)}</select>`)}${fld('권한 그룹', `<select class="in" name="grp">${opt(DB.TB_SYS_AuthGroup.map(g => [g.AuthCd, g.AuthNm]), (groupsOf(u.emp_no || '')[0]) || '', '없음')}</select>`)}${fld('구글 2차인증', `<label style="display:flex;gap:6px;align-items:center;height:30px"><input type="checkbox" name="totp" ${u.totp_enabled ? 'checked' : ''}>사용 (데모 OTP 123456)</label>`)}${fld('가입일', inp('cd', u.created_at || TODAY, 'readonly'))}</form>` : '<div class="empty">목록에서 회원을 선택하거나 [신규]를 누르세요.</div>';
    return ph('회원관리', '상단 목록 / 하단 입력·수정 (CRUD)') + `<div class="split"><div class="top-p"><div class="bar"><select class="in" data-f="status">${opt(Object.entries(USTAT).map(([k, v]) => [k, v[0]]), f.status, '상태 전체')}</select><input class="in" data-f="q" placeholder="아이디/이름/이메일/전화" value="${esc(f.q || '')}"><button class="btn pri" data-act="search">조회</button><button class="btn" data-act="resetSearch">초기화</button><span class="sp"></span><span class="note">${L.length}명 · 승인대기 ${DB.users.filter(x => x.status === 'pending').length}명</span></div>${tbl(['아이디', '이름', '이메일', '전화번호', '생년월일', '상태', '2차인증', '권한그룹', '가입일'], rows)}</div>
    <div class="bot-p card"><h3>${isNew ? '회원 등록' : u ? `회원 수정 — ${esc(u.display_name)}` : '입력 / 수정'}</h3>${form}<div class="bar" style="margin:12px 0 0"><button class="btn" data-act="usrNew" data-w>신규</button><button class="btn pri" data-act="usrSave" data-w ${u ? '' : 'disabled'}>저장</button><button class="btn dng" data-act="usrDel" data-w ${u && !isNew ? '' : 'disabled'}>삭제</button>${u && !isNew && u.status === 'pending' ? '<button class="btn ok" data-act="usrApprove" data-w>가입 승인</button>' : ''}</div></div></div>`;
  },
  after: pane => pane.classList.add('fx'),
};
ACT.usrPick = (el, tab) => { ST(tab.key).sel = el.dataset.id; renderTab(tab); };
ACT.usrNew = (el, tab) => { ST(tab.key).sel = 'new'; renderTab(tab); };
ACT.usrSave = (el, tab) => {
  const s = ST(tab.key), o = fd($('#uf', paneEl(tab.key))), isNew = s.sel === 'new', editing = isNew ? null : s.sel;
  const er = validateUser(o, editing); if (er) return toast(er, 'e');
  if (isNew) { DB.users.push({ id: 'u-' + o.id, email: o.em, password_hash: hp(o.pw), display_name: o.ln + o.fn, emp_no: o.id, status: o.status, auth_provider: 'local', last_name: o.ln, first_name: o.fn, birth_date: o.bd, phone: fmtPhone(o.ph), totp_enabled: o.totp, totp_secret: o.totp ? 'JBSWY3DPEHPK3PXP' : null, created_at: TODAY }); s.sel = o.id; }
  else { const u = userOf(editing); Object.assign(u, { email: o.em, display_name: o.ln + o.fn, last_name: o.ln, first_name: o.fn, birth_date: o.bd, phone: fmtPhone(o.ph), status: o.status, totp_enabled: o.totp, totp_secret: o.totp ? (u.totp_secret || 'JBSWY3DPEHPK3PXP') : null }); if (o.pw) u.password_hash = hp(o.pw); }
  DB.TB_SYS_AuthUser = DB.TB_SYS_AuthUser.filter(x => x.EmpNo !== o.id); if (o.grp) DB.TB_SYS_AuthUser.push({ AuthCd: o.grp, EmpNo: o.id });
  done(); if (o.id === SESSION.emp) { renderHeader(); renderMenu(); } toast('저장되었습니다.', 's');
};
ACT.usrDel = (el, tab) => {
  const s = ST(tab.key); if (s.sel === SESSION.emp) return toast('로그인 중인 본인 계정은 삭제할 수 없습니다.', 'e');
  if (!confirm(`회원 ${s.sel} 을(를) 삭제합니다.`)) return;
  DB.users = DB.users.filter(u => u.emp_no !== s.sel); DB.TB_SYS_AuthUser = DB.TB_SYS_AuthUser.filter(x => x.EmpNo !== s.sel); s.sel = null; done(); toast('삭제되었습니다.', 's');
};
ACT.usrApprove = (el, tab) => { const u = userOf(ST(tab.key).sel); u.status = 'approved'; done(); toast(`${u.display_name} 님의 가입을 승인했습니다.`, 's'); };

/* ---------- 시작 ---------- */
load();
try { const sv = JSON.parse(sessionStorage.getItem(SKEY) || 'null'); if (sv && userOf(sv.emp) && userOf(sv.emp).status === 'approved') { SESSION = sv; LOGID = sv.logId; } } catch (e) { }
if (SESSION) boot(); else showAuth('login');
</script>
</body>
</html>
